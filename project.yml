name: ListaCompra
options:
  bundleIdPrefix: com.santiagosanz
targets:
  ListaCompra:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - ListaCompraApp
    settings:
      base:
        INFOPLIST_FILE: ListaCompraApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.santiagosanz.listacompra
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
